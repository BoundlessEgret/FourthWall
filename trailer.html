<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第四面牆 FourthWall — 預告片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Noto Sans TC", sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px 14px; display: flex; gap: 14px; align-items: center; color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,.75)); opacity: 0; transition: opacity .3s; font-size: 14px; }
  body:hover #ui, #ui.show { opacity: 1; }
  #ui button { background: none; border: 0; color: #fff; font-size: 20px; cursor: pointer; padding: 4px 8px; }
  #bar { flex: 1; height: 6px; background: rgba(255,255,255,.3); border-radius: 3px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #ff4a7a; }
  #ui a { color: #ffd0e0; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><button id="pp">▶</button><div id="bar"><div id="fill"></div></div><span id="tm">0:00 / 1:15</span><button id="fs">⛶</button><a href="trailer.mp4" download>下載 MP4</a><a href="./">去玩遊戲 →</a></div>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/chars.js"></script>
<script src="js/sprites.js"></script>
<script src="js/bg.js"></script>
<script src="js/game.js"></script>
<script src="js/boss.js"></script>
<script src="js/bosses.js"></script>
<script src="js/stages.js"></script>
<script src="js/story.js"></script>
<script src="js/bombs.js"></script>
<script src="js/trailer.js"></script>
<script>
(async function () {
  const TR = FW.Trailer, cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const q = new URLSearchParams(location.search), RENDER = q.has('render');
  cv.width = TR.W; cv.height = TR.H;
  function fit() { const s = Math.min(innerWidth / TR.W, innerHeight / TR.H); cv.style.width = TR.W * s + 'px'; cv.style.height = TR.H * s + 'px'; }
  addEventListener('resize', fit); fit();
  const msg = (a, b) => { ctx.fillStyle = '#05030a'; ctx.fillRect(0, 0, TR.W, TR.H); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '700 56px "Noto Sans TC",sans-serif'; ctx.fillText(a, TR.W / 2, TR.H / 2); ctx.font = '500 32px "Noto Sans TC",sans-serif'; ctx.fillStyle = '#a8a0c8'; ctx.fillText(b || '', TR.W / 2, TR.H / 2 + 70); };
  msg('載入中……', '她們正在後台換衣服');
  const T = TR.allText();
  try { await Promise.all(['500 40px "Noto Sans TC"', '700 40px "Noto Sans TC"', '900 40px "Noto Sans TC"', '700 40px "Noto Serif TC"', '900 40px "Noto Serif TC"'].map(f => document.fonts.load(f, T))); } catch (e) { }
  await TR.prepare(p => msg('載入中……', `正在排練實機畫面 ${Math.round(p * 100)}%`));
  msg('載入中……', '正在合成音樂');
  const buf = await TR.renderAudio();

  if (RENDER) { // 輸出影片用：逐幀送到本機伺服器
    TR.live = false;
    const fps = +(q.get('fps') || 30), N = Math.ceil(TR.DUR * fps);
    if (!q.has('noaudio')) await fetch('/audio', { method: 'POST', body: wav(buf) });
    const from = +(q.get('from') || 0);
    for (let i = 0; i < N; i++) {
      TR.draw(ctx, i / fps);           // 遊戲片段需要依序演算，所以每一幀都要畫
      if (i < from) continue;
      const url = cv.toDataURL('image/jpeg', 0.92);   // 同步，不受背景分頁節流影響
      await fetch('/frame?i=' + i + '&b64=1', { method: 'POST', body: url.slice(url.indexOf(',') + 1) });
      document.title = `render ${i + 1}/${N}`;
    }
    await fetch('/done', { method: 'POST' });
    document.title = 'render done';
    return;
  }

  // ---------- 網頁版播放器 ----------
  TR.live = true;
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  let src = null, start = 0, pausedAt = 0, playing = false, ended = false, pauseSince = 0;
  const pp = document.getElementById('pp'), fill = document.getElementById('fill'), tm = document.getElementById('tm');
  function play() { if (ended) { location.reload(); return; } ac.resume(); src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start(0, pausedAt); start = ac.currentTime - pausedAt; playing = true; pp.textContent = '❚❚'; src.onended = () => { if (playing && cur() >= TR.DUR - 0.2) { playing = false; ended = true; pp.textContent = '↻'; } }; }
  function pause() { pausedAt = cur(); playing = false; if (src) { src.onended = null; src.stop(); } pp.textContent = '▶'; pauseSince = performance.now(); }
  const cur = () => playing ? Math.min(TR.DUR, ac.currentTime - start) : pausedAt;
  pp.onclick = e => { e.stopPropagation(); playing ? pause() : play(); };
  document.getElementById('fs').onclick = e => { e.stopPropagation(); document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); };
  cv.onclick = () => { playing ? pause() : play(); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); } });
  let started = false;
  function frame() {
    const t = cur();
    if (!started && !playing) {
      TR.draw(ctx, 0.01);
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, TR.W, TR.H);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '900 120px "Noto Sans TC"'; ctx.fillText('▶', TR.W / 2, TR.H / 2 + 20);
      ctx.font = '700 40px "Noto Sans TC"'; ctx.fillText('點一下開始播放（記得開聲音）', TR.W / 2, TR.H / 2 + 120);
      ctx.font = '500 28px "Noto Sans TC"'; ctx.fillStyle = '#a8a0c8'; ctx.fillText('……預告片需要你按一下才會開始。她們也是。', TR.W / 2, TR.H / 2 + 180);
    } else {
      started = true;
      TR.draw(ctx, t);
      if (!playing && !ended) { // 暫停中：她們還是醒著
        const s = (performance.now() - pauseSince) / 1000;
        ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, TR.W, TR.H);
        FW.Art.chibi(ctx, FW.CHARS.rinne.spec, 1720, 900 + Math.sin(s * 4) * 6, 0.7, { t: s * 60, expr: s > 6 ? 'smile' : 'normal' });
        ctx.fillStyle = '#fff'; ctx.font = '700 36px "Noto Sans TC"'; ctx.textAlign = 'right';
        ctx.fillText(s < 3 ? '暫停了？' : s < 7 ? '……我們其實還在動喔。' : '慢慢來，我們等你。', 1600, 880);
      }
    }
    fill.style.width = (cur() / TR.DUR * 100) + '%';
    tm.textContent = `${FW.U.fmtTime(cur())} / ${FW.U.fmtTime(TR.DUR)}`;
    requestAnimationFrame(frame);
  }
  frame();
  document.getElementById('ui').classList.add('show');

  function wav(b) {
    const n = b.length, ch = 2, sr = b.sampleRate, out = new DataView(new ArrayBuffer(44 + n * ch * 2));
    const ws = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
    ws(0, 'RIFF'); out.setUint32(4, 36 + n * ch * 2, true); ws(8, 'WAVE'); ws(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true);
    out.setUint32(24, sr, true); out.setUint32(28, sr * ch * 2, true); out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true); ws(36, 'data'); out.setUint32(40, n * ch * 2, true);
    const L = b.getChannelData(0), R = b.getChannelData(1); let o = 44;
    for (let i = 0; i < n; i++) { out.setInt16(o, Math.max(-1, Math.min(1, L[i])) * 32767, true); out.setInt16(o + 2, Math.max(-1, Math.min(1, R[i])) * 32767, true); o += 4; }
    return new Blob([out], { type: 'audio/wav' });
  }
})();
</script>
</body>
</html>
